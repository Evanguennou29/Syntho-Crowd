[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "synthocrowd-backend"
version = "2.0.0"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi==0.162.0", "uvicorn>=0.34,<1", "pydantic-settings>=2.8,<3",
  "sqlalchemy==2.1.8", "psycopg[binary]==3.3.8", "celery[redis]==5.6.3",
  "httpx>=0.28,<1",
]

[project.optional-dependencies]
worker = ["crewai[google-genai]==1.15.35", "playwright==1.64.1"]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
